# zot work order - the arcade's standing order, run every shift.
#
# Every run of this order must produce one NEW game. The order never changes;
# what changes is the catalogue it reads first, which is how each shift knows
# what has already been made.

objective: |-
  Design and build one brand-new browser game for the arcade - a concept that
  is not already in the catalogue - and publish it to the catalogue.

  Start by reading site/games.json: it lists every game made so far (slug,
  name, genre, mechanic, theme, tagline). Then write down at least ten
  candidate concepts that span different genres, core mechanics and themes,
  strike out every candidate that resembles an existing entry in any of those
  three, and build the one that is most unlike everything already there.
  Surprise is the point: no snake, pong, breakout, tetris, flappy or 2048
  clones unless the twist is genuinely the game. Small, sharp and finished
  beats large and half-done - a game is done when it is fun for two minutes.

acceptance:
  - 'site/games/<slug>/ contains exactly three files - index.html, game.css and game.js - and nothing else.'
  - 'index.html holds only the document structure: it links the stylesheet with <link rel="stylesheet" href="game.css"> and loads the script with <script src="game.js"></script>, and contains no inline <style> block and no inline <script> block. All CSS is in game.css; all JavaScript is in game.js. Inline style="..." attributes on individual elements are tolerated but discouraged.'
  - 'The three files were written and kept separate from the start - markup, then style, then behaviour - not authored as one file and split at the end.'
  - 'The game is entirely self-contained and relative-linked: no external requests of any kind, no build step, no framework, no npm. It runs when opened straight from disk (file://) and from GitHub Pages.'
  - 'The game is playable from start to finish with keyboard and/or mouse/touch; it shows its title and how to play; it has a clear goal and a win, lose or score condition; and it can be restarted without reloading the page.'
  - 'index.html links back to the catalogue with a relative link (../../ or ../../index.html).'
  - 'site/games.json has exactly one new entry appended, with the fields slug, name, genre, mechanic, theme, tagline, controls and created (today, YYYY-MM-DD); the file is still valid JSON; and no existing entry shares the new entry''s genre+mechanic+theme combination or its name.'
  - 'scripts/check.sh exits 0.'
  - 'Nothing outside site/games/<slug>/ and site/games.json was changed - unless scripts/check.sh was already failing when the run began, in which case the catalogue was repaired first and that repair is the only other change.'

constraints:
  - 'Vanilla HTML, CSS and JavaScript only. No npm, no CDN, no fonts, images or sounds fetched from the network; all art is drawn in code (canvas, SVG, CSS) or embedded as data URIs you generate yourself, and any sound is synthesised with the Web Audio API.'
  - 'Exactly three files per game - index.html, game.css, game.js - together under about 100 KB. Do not create any other file in the game directory: no assets, no modules, no README, no scratch files. Scratch work goes in /tmp.'
  - 'game.js is a classic script, not an ES module: no import/export, and no type="module" on the script tag. Load it at the end of <body> (or with defer) so the DOM exists when it runs, and wrap it in an IIFE to keep the global scope clean.'
  - 'Do not modify site/index.html, scripts/, orders/, the workflow, or any existing game. Do not git commit, push or tag - the workflow commits the shift.'
  - 'Playtest your own work: open index.html with a headless browser if one is available (chromium, google-chrome or playwright), or at minimum check that game.js has no syntax errors (node --check site/games/<slug>/game.js) and the page parses, before declaring success.'
