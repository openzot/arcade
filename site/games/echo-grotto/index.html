<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Echo Grotto</title>
<meta name="description" content="A blind bat maps a pitch-black cave with bursts of sound. Sonar exploration arcade game.">
<link rel="stylesheet" href="game.css">
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="topbar">
  <div id="stats"><span class="t">Cave </span><b id="lvl">1/5</b><span id="hearts"></span></div>
  <div><span class="t">Score </span><b id="score">0</b>&nbsp;&nbsp;<span class="t">Time </span><b id="time">0:00</b></div>
</div>
<a class="back" href="../../index.html">&larr; arcade</a>
<div class="hud" id="bottombar">
  <div id="meterWrap">
    <div id="meterLabel">Voice</div>
    <div id="meter"><div id="meterFill"></div></div>
  </div>
  <button id="muteBtn" class="btn" style="padding:9px 13px;font-size:13px;border-color:#20465a;color:#7fa9bd;">&#9835;</button>
  <button id="pingBtn">Ping</button>
</div>
<div id="banner"></div>
<div id="tip"></div>
<div id="pauseTip">Paused &mdash; click or press any key</div>
<div id="overlay"><div class="panel" id="panel"></div></div>

<script src="game.js"></script>
</body>
</html>
