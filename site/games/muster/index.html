<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Muster!</title>
    <meta
      name="description"
      content="Herd a stubborn flock of sheep into the pen before the timer runs out. A sunny sheepdog strategy-arcade game."
    />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <canvas id="cv"></canvas>

    <div class="hud" id="topbar">
      <div>
        <span class="t">Field</span> <b id="lvl">1/5</b>&nbsp;&nbsp;<span
          class="t"
          >Penned</span
        >
        <b id="penned">0/6</b>
      </div>
      <div>
        <span class="t">Time</span> <b id="time">60</b>&nbsp;&nbsp;<span
          class="t"
          >Score</span
        >
        <b id="score">0</b>
      </div>
    </div>
    <a class="back" href="../../index.html">&larr; arcade</a>
    <div class="hud" id="bottombar">
      <div id="barkWrap">
        <div id="barkLabel">Bark</div>
        <div id="barkMeter"><div id="barkFill"></div></div>
      </div>
      <div style="display: flex; gap: 10px; align-items: flex-end">
        <button id="muteBtn" title="Sound on/off">&#9834;</button>
        <button id="barkBtn">Bark</button>
      </div>
    </div>
    <div id="banner"></div>
    <div id="overlay"><div class="panel" id="panel"></div></div>

    <script src="game.js"></script>
  </body>
</html>
